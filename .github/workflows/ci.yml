name: Public build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      SEEIN_INSTANCE: ci
      SEEIN_PREVIEW_USER_DATA: ${{ github.workspace }}\.build\ci-user
      SEEIN_PREVIEW_SYSTEM_DATA: ${{ github.workspace }}\.build\ci-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public source checks
        run: python scripts/check-public-source.py
      - name: Build and unit tests
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Module headless tests
        shell: pwsh
        run: |
          foreach ($project in @('Seein.CapturePlayback.Tests','Seein.ThemeEditor.Tests','Seein.ToolShortcuts.Tests')) {
            dotnet run --project "tests/$project/$project.csproj" -c Release
            if ($LASTEXITCODE) { throw "$project failed" }
          }
          dotnet run --project tests/Seein.PublicRelease.Tests -c Release -- "${{ github.workspace }}"
          if ($LASTEXITCODE) { throw 'Public first-run tests failed' }
          dotnet run --project tests/Seein.PublicRelease.Tests -c Release -- "${{ github.workspace }}" --v220
          if ($LASTEXITCODE) { throw 'Plugin center UI tests failed' }
          ./tests/core-upgrade.test.ps1
